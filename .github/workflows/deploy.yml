name: 🚀 Deploy Angular Frontend to Apache2 VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------- CHECKOUT -----------------
      - name: 🧩 Checkout código
        uses: actions/checkout@v4

      # ----------------- NODE -----------------
      - name: ⚙ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------- DEPENDENCIAS -----------------
      - name: 📦 Instalar dependencias frontend
        run: |
          cd frontend
          npm ci
          npm install -g @angular/cli
          cd ..

      # ----------------- BUILD FRONTEND -----------------
      - name: 🏗 Compilar frontend Angular
        run: |
          cd frontend
          ng build --configuration production --base-href /
          cd ..

      # ----------------- PREPARAR ARCHIVOS FRONTEND -----------------
      - name: 🧩 Preparar archivos frontend
        run: |
          rm -rf deploy-frontend
          mkdir deploy-frontend
          cp -r frontend/dist/frontend/browser/* deploy-frontend/
          cp frontend/dist/frontend/3rdpartylicenses.txt deploy-frontend/ || true
          cp frontend/dist/frontend/prerendered-routes.json deploy-frontend/ || true

      # ----------------- DEBUG -----------------
      - name: 🧾 Ver contenido listo para deploy
        run: ls -R deploy-frontend

      # ----------------- LIMPIAR SOLO FRONTEND EN EL SERVIDOR -----------------
      - name: 🧹 Limpiar carpeta frontend en servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            rm -rf /var/www/fabian_site/deploy-frontend/*
            echo "✔ Carpeta frontend limpiada en servidor"

      # ----------------- SUBIR ARCHIVOS FRONTEND -----------------
      - name: 📤 Subir frontend al servidor Apache2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy-frontend/*"
          target: "/var/www/fabian_site/deploy-frontend/"
          overwrite: true

      # ----------------- AJUSTAR PERMISOS -----------------
      - name: ⚙ Ajustar permisos frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "✔ Permisos frontend ajustados"
            echo "✔ Deploy completado sin tocar backend" 