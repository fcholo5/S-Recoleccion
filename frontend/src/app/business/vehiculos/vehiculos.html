<!-- src/app/business/vehiculos/vehiculos.html -->
<div class="vehiculos-container">
  <div class="header">
    <h1>🚛 Gestión de Vehículos</h1>
    <button (click)="mostrarFormulario = true" class="btn-create" *ngIf="!mostrarFormulario">
      + Registrar Vehículo
    </button>
  </div>

  <!-- Formulario de creación -->
  <div class="form-panel" *ngIf="mostrarFormulario">
    <div class="form-header">
      <h3>Registrar Nuevo Vehículo</h3>
      <button (click)="mostrarFormulario = false" class="btn-close">×</button>
    </div>
    
    <div class="form-body">
      <div class="form-group">
        <label>Placa *</label>
        <input type="text" [(ngModel)]="nuevoVehiculo.placa" placeholder="Ej: ABC-123" class="form-input">
      </div>
      
      <div class="form-group">
        <label>Marca *</label>
        <input type="text" [(ngModel)]="nuevoVehiculo.marca" placeholder="Ej: SUZUKI" class="form-input">
      </div>
      
      <div class="form-group">
        <label>Modelo *</label>
        <input type="text" [(ngModel)]="nuevoVehiculo.modelo" placeholder="Ej: 1990" class="form-input">
      </div>
      
      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="nuevoVehiculo.activo"> 
          Activo
        </label>
      </div>
    </div>
    
    <div class="form-footer">
      <button (click)="mostrarFormulario = false" class="btn-cancel">Cancelar</button>
      <button (click)="crearVehiculo()" class="btn-save">Registrar Vehículo</button>
    </div>
  </div>

  <!-- Lista de vehículos -->
  <div class="vehiculos-list" *ngIf="!mostrarFormulario">
    <div *ngIf="loading" class="message loading">
      <div class="spinner"></div>
      <p>Cargando vehículos...</p>
    </div>

    <div *ngIf="error" class="message error">
      <p>{{ error }}</p>
      <button (click)="cargarVehiculos()" class="btn-retry">Reintentar</button>
    </div>

    <div *ngIf="!loading && vehiculos.length === 0" class="message empty">
      <p>No hay vehículos registrados.</p>
      <button (click)="mostrarFormulario = true" class="btn-create">Registrar Primer Vehículo</button>
    </div>

    <div class="vehiculos-table" *ngIf="!loading && vehiculos.length > 0">
      <table>
        <thead>
          <tr>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let vehiculo of vehiculos">
            <td>{{ vehiculo.placa }}</td>
            <td>{{ vehiculo.marca }}</td>
            <td>{{ vehiculo.modelo }}</td>
            <td>
              <span [class]="vehiculo.activo ? 'status-active' : 'status-inactive'">
                {{ vehiculo.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="actions">
              <button 
                (click)="toggleActivo(vehiculo)" 
                [class.btn-active]="vehiculo.activo"
                [class.btn-inactive]="!vehiculo.activo"
                title="{{ vehiculo.activo ? 'Desactivar' : 'Activar' }}">
                {{ vehiculo.activo ? '🟢' : '🔴' }}
              </button>
              <button 
                (click)="eliminarVehiculo(vehiculo.id)" 
                class="btn-delete"
                title="Eliminar">
                🗑️
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
