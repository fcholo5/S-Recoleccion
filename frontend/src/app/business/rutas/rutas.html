<!-- src/app/business/rutas/rutas.html -->
<div class="rutas-container">
  <div class="header">
    <h1>🛣️ Mis Rutas de Recolección</h1>
    <button (click)="abrirModalDibujo()" class="btn-primary">
      ✏️ Crear Nueva Ruta
    </button>
  </div>

  <div class="content">
    <!-- Mensaje de carga -->
    <div *ngIf="loading" class="message">
      <p>Cargando rutas...</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="message error">
      <p>{{ error }}</p>
      <button (click)="cargarRutas()" class="btn-secondary">Reintentar</button>
    </div>

    <!-- Lista de rutas -->
    <div *ngIf="!loading && rutas.length === 0" class="message empty">
      <p>Aún no tienes rutas creadas.</p>
    </div>

    <div class="rutas-list" *ngIf="!loading && rutas.length > 0">
      <div class="ruta-card" *ngFor="let ruta of rutas">
        <div class="ruta-info">
          <h3>{{ ruta.nombre_ruta }}</h3>
          <div class="ruta-meta">
            <span class="badge">{{ calcularLongitud(ruta) }} km</span>
            <span class="points">{{ ruta.shape ? (JSON.parse(ruta.shape).coordinates?.length || 0) : 0 }} puntos</span>
          </div>
        </div>
        <div class="ruta-actions">
          <button class="btn-icon" title="Ver en mapa">
            <i>🗺️</i>
          </button>
          <button class="btn-icon" title="Editar">
            <i>✏️</i>
          </button>
          <button class="btn-icon danger" title="Eliminar">
            <i>🗑️</i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE DIBUJO -->
  <div class="modal-backdrop" *ngIf="showMapModal" (click)="cancelarDibujo()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>✏️ Dibujando Ruta...</h3>
        <button (click)="cancelarDibujo()" class="close-btn">×</button>
      </div>

      <div id="embedded-map" class="map-container"></div>

      <div class="modal-footer">
        <button (click)="finalizarRuta()" class="btn-success">
          ✅ Finalizar y Guardar Ruta
        </button>
        <button (click)="cancelarDibujo()" class="btn-cancel">
          ❌ Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
