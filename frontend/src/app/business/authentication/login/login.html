<div class="login-wrapper">

  <!-- PANEL IZQUIERDO -->
  <div class="left-panel">
    <h1 class="app-name">BuenAseo</h1>
    <img src="/assets/fondo-login1.png" class="truck-img" alt="Camión de basura" />
    <p class="welcome-text">
      Ingresa para rastrear el carro de la basura en tiempo real y sacar tus residuos a tiempo.
    </p>
  </div>

  <!-- PANEL DERECHO -->
  <div class="right-panel">
    <h1 class="login-title">Bienvenido a BuenAseo</h1>

    <form (ngSubmit)="onSubmit()">

      <div class="input-group">
        <i class="fa-regular fa-envelope icon"></i>
        <input type="email" placeholder="Correo Electrónico" [(ngModel)]="email" name="email" required />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" required />
      </div>

      <div class="options-wrapper">
        <label><input type="checkbox" /> Recuérdame</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <div class="divider">o continuar con</div>

    <div class="social-buttons">
      <button type="button" class="fb">
        <img src="/assets/facebook.png" /> Facebook
      </button>
      <button type="button" class="google">
        <img src="/assets/google.png" /> Google
      </button>
    </div>

    <p class="create-account">
      ¿No tienes cuenta? <a href="#">Crear una cuenta</a>
    </p>
  </div>

</div>
