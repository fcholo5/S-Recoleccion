<div class="login-wrapper">

  <!-- PANEL IZQUIERDO -->
  <div class="left-panel">
    <h1 class="app-name">BuenAseo</h1>

    <img src="/assets/fondo-login1.png" class="truck-img" alt="camion basura" />
    
    <h2 class="welcome-title">BIENVENIDO</h2>
    <p class="welcome-text">
      Ingresa para rastrear el carro de la basura en tiempo real y sacar tus residuos a tiempo.
    </p>
  </div>

  <!-- PANEL DERECHO -->
  <div class="right-panel">
    <h1 class="title">Bienvenido a BuenAseo</h1>

    <form (ngSubmit)="onSubmit()">

      <!-- EMAIL -->
      <div class="input-group">
        <i class="fa-regular fa-envelope icon"></i>
        <input
          type="email"
          placeholder="Correo Electrónico"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <!-- PASSWORD -->
      <div class="input-group">
        <i class="fa-solid fa-lock icon"></i>
        <input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <!-- RECORDAR Y OLVIDASTE -->
      <div class="options">
        <label> <input type="checkbox" /> Recuérdame </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- BOTÓN INGRESAR -->
      <button type="submit" class="btn-login">Ingresar</button>

      <div class="divider">o continuar con</div>

      <!-- BOTONES REDES -->
      <div class="social-buttons">
        <button type="button" class="fb">
          <img src="/assets/facebook.png" />
          Facebook
        </button>

        <button type="button" class="google">
          <img src="/assets/google.png" />
          Google
        </button>
      </div>

    </form>

    <!-- CREAR CUENTA FUERA DEL FORM -->
    <p class="create-account">
      ¿No tienes cuenta? <a href="">Crear una cuenta</a>
    </p>

  </div>

</div>
